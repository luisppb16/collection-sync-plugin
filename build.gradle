import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.18.1'
    id 'jacoco'
}

group = 'com.luisppb16'
version = '1.0.0'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    // JSON/YAML - Jackson (collections Postman v2.1 e Insomnia v4)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.5'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.5'

    // Instance factory for tests
    testImplementation 'org.instancio:instancio-junit:6.0.0'

    // Testing
    // JUnit 4 is kept on the test classpath because the IntelliJ Platform test framework
    // (used via the bundled test infrastructure) references org.junit.rules.TestRule at runtime.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    intellijPlatform {
        intellijIdea '2026.2'
        bundledPlugin 'com.intellij.java'
        // IntelliJ Platform test framework (BasePlatformTestCase) for PSI-level tests.
        // Groovy does not auto-resolve Kotlin objects, so INSTANCE must be used explicitly.
        testFramework TestFrameworkType.Platform.INSTANCE
        // Java test framework: mock JDK so JDK types (String, List, Optional) resolve in PSI tests.
        testFramework TestFrameworkType.Plugin.Java.INSTANCE
    }

    // Runs the JUnit3/JUnit4-style BasePlatformTestCase suites on the JUnit Platform.
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.14.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << "-Xlint:all" << "-Werror" << "-Xlint:-unchecked"
}

intellijPlatform {
    buildSearchableOptions = false

    signing {
        certificateChain.set(providers.environmentVariable("CERTIFICATE_CHAIN"))
        privateKey.set(providers.environmentVariable("PRIVATE_KEY"))
        password.set(providers.environmentVariable("PRIVATE_KEY_PASSWORD"))
    }

    publishing {
        token.set(providers.environmentVariable("PUBLISH_TOKEN"))
    }

    pluginVerification {
        ides {
            recommended()
        }
    }
}

// The IntelliJ test fixture persists its index caches in the sandbox system directory
// (.intellijPlatform/sandbox/.../system-test) between runs; a corrupted persisted index makes the
// suite flaky (ServiceNotReadyException / StorageException), so each test run starts from a fresh
// system directory instead of reusing the persisted index storage.
def intellijTestSystemPath = layout.buildDirectory.dir('intellij-system-test')
tasks.register('cleanIntellijTestSystem', Delete) {
    delete intellijTestSystemPath
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    dependsOn cleanIntellijTestSystem
    systemProperty 'idea.system.path', intellijTestSystemPath.get().asFile.absolutePath
    maxHeapSize = '2g'
    jvmArgs('-Xshare:off')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// These tasks come from the IntelliJ Platform plugin; guard with findByName so the build script
// does not fail in environments where they are not registered.
['buildSearchableOptions', 'jarSearchableOptions'].each { name ->
    def task = tasks.findByName(name)
    if (task != null) {
        task.enabled = false
    }
}