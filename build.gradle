import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask.FailureLevel

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'jacoco'
    id 'pmd'
    id 'com.diffplug.spotless' version '8.1.0'
}

group = 'com.luisppb16'
version = '1.0.4'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    // JSON/YAML - Jackson (collections Postman v2.1 e Insomnia v4/v5)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.22.4'
    // Declared explicitly: JsonYaml drives SnakeYAML directly to expand YAML aliases/merge keys
    // (Jackson's YAML parser keeps them as raw text).
    implementation 'org.yaml:snakeyaml:2.7'

    // Instance factory for tests
    testImplementation 'org.instancio:instancio-junit:6.1.0'

    // Testing
    // JUnit 4 is kept on the test classpath because the IntelliJ Platform test framework
    // (used via the bundled test infrastructure) references org.junit.rules.TestRule at runtime.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'

    intellijPlatform {
        intellijIdea '2026.2'
        bundledPlugin 'com.intellij.java'
        // IntelliJ Platform test framework (BasePlatformTestCase) for PSI-level tests.
        // Groovy does not auto-resolve Kotlin objects, so INSTANCE must be used explicitly.
        testFramework TestFrameworkType.Platform.INSTANCE
        // Java test framework: mock JDK so JDK types (String, List, Optional) resolve in PSI tests.
        testFramework TestFrameworkType.Plugin.Java.INSTANCE
    }

    // Runs the JUnit3/JUnit4-style BasePlatformTestCase suites on the JUnit Platform.
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << "-Xlint:all" << "-Werror" << "-Xlint:-unchecked"
}

intellijPlatform {
    buildSearchableOptions = false

    signing {
        certificateChain.set(providers.environmentVariable("CERTIFICATE_CHAIN"))
        privateKey.set(providers.environmentVariable("PRIVATE_KEY"))
        password.set(providers.environmentVariable("PRIVATE_KEY_PASSWORD"))
    }

    publishing {
        token.set(providers.environmentVariable("PUBLISH_TOKEN"))
    }

    pluginVerification {
        ides {
            recommended()
        }
        failureLevel = [
            FailureLevel.COMPATIBILITY_WARNINGS,
            FailureLevel.COMPATIBILITY_PROBLEMS,
            FailureLevel.DEPRECATED_API_USAGES,
            FailureLevel.SCHEDULED_FOR_REMOVAL_API_USAGES,
            FailureLevel.EXPERIMENTAL_API_USAGES,
            FailureLevel.OVERRIDE_ONLY_API_USAGES,
            FailureLevel.NON_EXTENDABLE_API_USAGES,
            FailureLevel.PLUGIN_STRUCTURE_WARNINGS,
            FailureLevel.MISSING_DEPENDENCIES,
            FailureLevel.INVALID_PLUGIN,
            FailureLevel.NOT_DYNAMIC
        ]
        ignoredProblemsFile.set(layout.projectDirectory.file(
            "config/pluginVerifier/ignored-problems.txt"))
    }
}

// The IntelliJ test fixture persists its index caches in the sandbox system directory
// (.intellijPlatform/sandbox/.../system-test) between runs; a corrupted persisted index makes the
// suite flaky (ServiceNotReadyException / StorageException), so each test run starts from a fresh
// system directory instead of reusing the persisted index storage.
def intellijTestSystemPath = layout.buildDirectory.dir('intellij-system-test')
tasks.register('cleanIntellijTestSystem', Delete) {
    delete intellijTestSystemPath
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    dependsOn cleanIntellijTestSystem
    systemProperty 'idea.system.path', intellijTestSystemPath.get().asFile.absolutePath
    maxHeapSize = '2g'
    jvmArgs('-Xshare:off')
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

check {
    dependsOn pmdMain, spotlessCheck, jacocoTestReport
}

spotless {
    java {
        googleJavaFormat()
        importOrder()
        removeUnusedImports()
    }
}

pmd {
    toolVersion = '7.29.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
}

// These tasks come from the IntelliJ Platform plugin; guard with findByName so the build script
// does not fail in environments where they are not registered.
['buildSearchableOptions', 'jarSearchableOptions'].each { name ->
    def task = tasks.findByName(name)
    if (task != null) {
        task.enabled = false
    }
}